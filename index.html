<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>امتحان مقدمة في الحاسبات - HICMIS</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&family=Tajawal:wght@300;400;500;700;800&display=swap');

  :root {
    --bg-primary: #0a0e1a;
    --bg-secondary: #111827;
    --bg-card: #1a2235;
    --bg-card-hover: #1f2a42;
    --accent-blue: #3b82f6;
    --accent-cyan: #06b6d4;
    --accent-green: #10b981;
    --accent-red: #ef4444;
    --accent-yellow: #f59e0b;
    --accent-purple: #8b5cf6;
    --text-primary: #f1f5f9;
    --text-secondary: #94a3b8;
    --text-muted: #64748b;
    --border: #1e3a5f;
    --border-light: #2d4a6e;
    --glow-blue: 0 0 20px rgba(59,130,246,0.3);
    --glow-green: 0 0 20px rgba(16,185,129,0.3);
    --glow-red: 0 0 20px rgba(239,68,68,0.3);
    --radius: 16px;
    --radius-sm: 10px;
    --transition: all 0.25s cubic-bezier(0.4,0,0.2,1);
  }

  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

  body {
    font-family:'Cairo','Tajawal',sans-serif;
    background: var(--bg-primary);
    color: var(--text-primary);
    min-height:100vh;
    overflow-x:hidden;
    background-image:
      radial-gradient(ellipse at 20% 20%, rgba(59,130,246,0.07) 0%, transparent 60%),
      radial-gradient(ellipse at 80% 80%, rgba(139,92,246,0.05) 0%, transparent 60%);
  }

  /* ===== SCREENS ===== */
  .screen { display:none; min-height:100vh; }
  .screen.active { display:flex; flex-direction:column; align-items:center; justify-content:center; padding:20px; }

  /* ===== PARTICLES ===== */
  .particles {
    position:fixed; top:0; left:0; width:100%; height:100%;
    pointer-events:none; z-index:0; overflow:hidden;
  }
  .particle {
    position:absolute; width:2px; height:2px; border-radius:50%;
    background: var(--accent-blue); opacity:0.4;
    animation: float linear infinite;
  }
  @keyframes float {
    0% { transform:translateY(100vh) translateX(0); opacity:0; }
    10% { opacity:0.4; }
    90% { opacity:0.4; }
    100% { transform:translateY(-100px) translateX(30px); opacity:0; }
  }

  /* ===== START SCREEN ===== */
  #startScreen {
    background: linear-gradient(135deg, #0a0e1a 0%, #111827 100%);
    position:relative;
    z-index:1;
  }

  .start-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 48px 40px;
    max-width: 520px;
    width: 100%;
    text-align: center;
    box-shadow: 0 25px 60px rgba(0,0,0,0.5), var(--glow-blue);
    position: relative;
    z-index:2;
    animation: slideUp 0.6s cubic-bezier(0.34,1.56,0.64,1);
  }

  @keyframes slideUp {
    from { transform:translateY(40px); opacity:0; }
    to { transform:translateY(0); opacity:1; }
  }

  .logo-area {
    display:flex; flex-direction:column; align-items:center; gap:12px; margin-bottom:32px;
  }

  .logo-icon {
    width:70px; height:70px; border-radius:50%;
    background: linear-gradient(135deg, var(--accent-blue), var(--accent-cyan));
    display:flex; align-items:center; justify-content:center;
    font-size:32px;
    box-shadow: var(--glow-blue);
    animation: pulse 3s ease-in-out infinite;
  }

  @keyframes pulse {
    0%,100% { box-shadow: 0 0 20px rgba(59,130,246,0.3); }
    50% { box-shadow: 0 0 40px rgba(59,130,246,0.6); }
  }

  .logo-title { font-size:13px; color:var(--accent-cyan); letter-spacing:3px; font-weight:600; text-transform:uppercase; }

  .exam-title {
    font-size:26px; font-weight:900; color:var(--text-primary);
    line-height:1.3; margin-bottom:8px;
  }

  .exam-subtitle { font-size:14px; color:var(--text-secondary); margin-bottom:32px; }

  .stats-row {
    display:flex; justify-content:center; gap:20px; margin-bottom:32px; flex-wrap:wrap;
  }

  .stat-chip {
    background: rgba(59,130,246,0.1);
    border: 1px solid rgba(59,130,246,0.3);
    border-radius:50px; padding:8px 16px;
    font-size:13px; color:var(--accent-blue); font-weight:600;
    display:flex; align-items:center; gap:6px;
  }

  .input-group { margin-bottom:24px; text-align:right; }
  .input-label { font-size:14px; color:var(--text-secondary); margin-bottom:8px; display:block; }

  .name-input {
    width:100%; padding:14px 18px;
    background: var(--bg-secondary);
    border: 2px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text-primary);
    font-family:'Cairo',sans-serif;
    font-size:16px; direction:rtl;
    transition: var(--transition);
    outline:none;
  }

  .name-input:focus { border-color: var(--accent-blue); box-shadow: var(--glow-blue); }
  .name-input::placeholder { color:var(--text-muted); }

  .timer-select-group { margin-bottom:28px; text-align:right; }
  .timer-options { display:flex; gap:10px; flex-wrap:wrap; }
  .timer-option {
    flex:1; min-width:80px; padding:10px 8px;
    background: var(--bg-secondary);
    border: 2px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text-secondary);
    font-family:'Cairo',sans-serif;
    font-size:13px; cursor:pointer;
    transition: var(--transition); text-align:center;
  }
  .timer-option:hover, .timer-option.selected {
    border-color: var(--accent-blue); color:var(--accent-blue);
    background: rgba(59,130,246,0.1);
  }

  .start-btn {
    width:100%; padding:16px;
    background: linear-gradient(135deg, var(--accent-blue), var(--accent-cyan));
    border:none; border-radius: var(--radius-sm);
    color:#fff; font-family:'Cairo',sans-serif;
    font-size:18px; font-weight:700; cursor:pointer;
    transition: var(--transition);
    box-shadow: var(--glow-blue);
  }

  .start-btn:hover { transform:translateY(-2px); box-shadow:0 10px 30px rgba(59,130,246,0.5); }
  .start-btn:active { transform:translateY(0); }

  /* ===== EXAM SCREEN ===== */
  #examScreen { padding:0; justify-content:flex-start; background:var(--bg-primary); }

  .exam-header {
    width:100%; background: var(--bg-secondary);
    border-bottom: 1px solid var(--border);
    padding:14px 20px; position:sticky; top:0; z-index:100;
    box-shadow: 0 4px 20px rgba(0,0,0,0.3);
  }

  .header-top {
    display:flex; justify-content:space-between; align-items:center;
    max-width:860px; margin:0 auto;
  }

  .student-name-badge {
    display:flex; align-items:center; gap:8px;
    background: rgba(59,130,246,0.1); border:1px solid rgba(59,130,246,0.3);
    border-radius:50px; padding:6px 14px;
    font-size:13px; color:var(--accent-blue); font-weight:600;
  }

  .timer-display {
    display:flex; align-items:center; gap:8px;
    padding:8px 16px; border-radius:50px;
    background: rgba(16,185,129,0.1); border:1px solid rgba(16,185,129,0.3);
    font-size:20px; font-weight:700; color:var(--accent-green);
    font-variant-numeric:tabular-nums; transition: var(--transition);
    min-width:110px; justify-content:center;
  }

  .timer-display.warning {
    background: rgba(245,158,11,0.1); border-color:rgba(245,158,11,0.3);
    color:var(--accent-yellow);
  }

  .timer-display.danger {
    background: rgba(239,68,68,0.15); border-color:rgba(239,68,68,0.5);
    color:var(--accent-red); animation:timerPulse 0.5s ease-in-out infinite;
  }

  @keyframes timerPulse { 0%,100% { opacity:1; } 50% { opacity:0.6; } }

  .progress-area {
    max-width:860px; margin:10px auto 0;
    display:flex; align-items:center; gap:12px;
  }

  .progress-bar {
    flex:1; height:6px; background: var(--bg-card);
    border-radius:10px; overflow:hidden;
  }

  .progress-fill {
    height:100%; background:linear-gradient(90deg,var(--accent-blue),var(--accent-cyan));
    border-radius:10px; transition: width 0.4s ease;
  }

  .progress-text { font-size:13px; color:var(--text-secondary); white-space:nowrap; font-weight:600; }

  /* ===== QUESTION CARD ===== */
  .exam-body {
    flex:1; width:100%; max-width:860px; margin:0 auto;
    padding:24px 20px 100px;
  }

  .question-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding:28px;
    margin-bottom:20px;
    animation: fadeInCard 0.35s ease;
    box-shadow: 0 8px 32px rgba(0,0,0,0.3);
  }

  @keyframes fadeInCard {
    from { opacity:0; transform:translateY(16px); }
    to { opacity:1; transform:translateY(0); }
  }

  .question-meta {
    display:flex; justify-content:space-between; align-items:center;
    margin-bottom:16px;
  }

  .question-num {
    background: linear-gradient(135deg, var(--accent-blue), var(--accent-cyan));
    -webkit-background-clip:text; -webkit-text-fill-color:transparent;
    font-size:13px; font-weight:700; letter-spacing:1px;
  }

  .question-type-badge {
    padding:4px 12px; border-radius:50px; font-size:11px; font-weight:600;
    letter-spacing:0.5px;
  }

  .badge-mcq { background:rgba(139,92,246,0.15); color:var(--accent-purple); border:1px solid rgba(139,92,246,0.3); }
  .badge-tf { background:rgba(6,182,212,0.15); color:var(--accent-cyan); border:1px solid rgba(6,182,212,0.3); }

  .question-text {
    font-size:17px; font-weight:600; line-height:1.7;
    color:var(--text-primary); margin-bottom:22px;
  }

  /* ===== OPTIONS ===== */
  .options-grid { display:flex; flex-direction:column; gap:10px; }

  .option-btn {
    display:flex; align-items:center; gap:14px;
    padding:14px 18px;
    background: var(--bg-secondary);
    border: 2px solid var(--border);
    border-radius: var(--radius-sm);
    cursor:pointer; transition: var(--transition);
    text-align:right; direction:rtl;
    font-family:'Cairo',sans-serif;
    font-size:15px; color:var(--text-primary);
    position:relative; overflow:hidden;
  }

  .option-btn::before {
    content:''; position:absolute; left:0; top:0; bottom:0;
    width:0; background:linear-gradient(90deg,rgba(59,130,246,0.1),transparent);
    transition: width 0.3s ease;
  }

  .option-btn:hover { border-color:var(--accent-blue); transform:translateX(-3px); box-shadow:var(--glow-blue); }
  .option-btn:hover::before { width:100%; }

  .option-btn.selected { border-color:var(--accent-blue); background:rgba(59,130,246,0.15); }
  .option-btn.correct { border-color:var(--accent-green); background:rgba(16,185,129,0.15); color:var(--accent-green); box-shadow:var(--glow-green); }
  .option-btn.wrong { border-color:var(--accent-red); background:rgba(239,68,68,0.15); color:var(--accent-red); box-shadow:var(--glow-red); }

  .option-letter {
    width:32px; height:32px; min-width:32px;
    border-radius:50%; border:2px solid var(--border-light);
    display:flex; align-items:center; justify-content:center;
    font-size:13px; font-weight:700; color:var(--text-muted);
    transition: var(--transition);
  }

  .option-btn:hover .option-letter { border-color:var(--accent-blue); color:var(--accent-blue); }
  .option-btn.correct .option-letter { border-color:var(--accent-green); color:var(--accent-green); background:rgba(16,185,129,0.2); }
  .option-btn.wrong .option-letter { border-color:var(--accent-red); color:var(--accent-red); background:rgba(239,68,68,0.2); }

  .option-text { flex:1; line-height:1.5; }

  /* ===== NAV BUTTONS ===== */
  .nav-bar {
    position:fixed; bottom:0; left:0; right:0;
    background: var(--bg-secondary);
    border-top:1px solid var(--border);
    padding:14px 20px;
    display:flex; justify-content:center; align-items:center; gap:12px;
    z-index:100; box-shadow: 0 -8px 24px rgba(0,0,0,0.4);
  }

  .nav-bar > * { max-width:860px; }

  .nav-inner { display:flex; gap:12px; width:100%; max-width:860px; }

  .nav-btn {
    flex:1; padding:13px 20px;
    border:none; border-radius: var(--radius-sm);
    font-family:'Cairo',sans-serif; font-size:15px; font-weight:700;
    cursor:pointer; transition: var(--transition);
  }

  .btn-next {
    background: linear-gradient(135deg, var(--accent-blue), var(--accent-cyan));
    color:#fff; box-shadow:var(--glow-blue);
  }

  .btn-next:hover { transform:translateY(-2px); box-shadow:0 8px 24px rgba(59,130,246,0.5); }
  .btn-next:active { transform:translateY(0); }
  .btn-next:disabled { opacity:0.4; cursor:not-allowed; transform:none; }

  .btn-finish {
    background: linear-gradient(135deg, var(--accent-green), #059669);
    color:#fff; box-shadow:var(--glow-green);
  }

  .btn-finish:hover { transform:translateY(-2px); box-shadow:0 8px 24px rgba(16,185,129,0.5); }

  /* ===== RESULT SCREEN ===== */
  #resultScreen { background:var(--bg-primary); padding:20px; }

  .result-card {
    background: var(--bg-card);
    border:1px solid var(--border);
    border-radius:24px; padding:36px 28px;
    max-width:700px; width:100%; text-align:center;
    box-shadow:0 25px 60px rgba(0,0,0,0.5);
    animation: slideUp 0.6s ease;
    margin-bottom:24px;
  }

  .grade-circle {
    width:140px; height:140px; border-radius:50%;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    margin:0 auto 24px;
    border:4px solid; position:relative;
  }

  .grade-circle::after {
    content:''; position:absolute; inset:-8px; border-radius:50%;
    border:2px dashed; opacity:0.3;
  }

  .grade-circle.excellent { border-color:var(--accent-green); color:var(--accent-green); box-shadow:var(--glow-green); }
  .grade-circle.excellent::after { border-color:var(--accent-green); }
  .grade-circle.very-good { border-color:var(--accent-blue); color:var(--accent-blue); box-shadow:var(--glow-blue); }
  .grade-circle.very-good::after { border-color:var(--accent-blue); }
  .grade-circle.good { border-color:var(--accent-cyan); color:var(--accent-cyan); }
  .grade-circle.good::after { border-color:var(--accent-cyan); }
  .grade-circle.pass { border-color:var(--accent-yellow); color:var(--accent-yellow); }
  .grade-circle.pass::after { border-color:var(--accent-yellow); }
  .grade-circle.fail { border-color:var(--accent-red); color:var(--accent-red); box-shadow:var(--glow-red); }
  .grade-circle.fail::after { border-color:var(--accent-red); }

  .grade-percent { font-size:38px; font-weight:900; }
  .grade-label { font-size:12px; font-weight:600; letter-spacing:1px; opacity:0.8; }

  .grade-title { font-size:28px; font-weight:900; margin-bottom:6px; }
  .grade-subtitle { font-size:14px; color:var(--text-secondary); margin-bottom:28px; }

  .result-stats {
    display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-bottom:28px;
  }

  .result-stat {
    background: var(--bg-secondary); border-radius:12px; padding:16px 12px;
    border:1px solid var(--border);
  }

  .result-stat-val { font-size:24px; font-weight:900; margin-bottom:4px; }
  .result-stat-label { font-size:12px; color:var(--text-secondary); }
  .stat-correct .result-stat-val { color:var(--accent-green); }
  .stat-wrong .result-stat-val { color:var(--accent-red); }
  .stat-total .result-stat-val { color:var(--accent-blue); }

  .action-btns { display:flex; gap:12px; flex-wrap:wrap; }

  .action-btn {
    flex:1; min-width:120px; padding:13px 16px;
    border:none; border-radius:var(--radius-sm);
    font-family:'Cairo',sans-serif; font-size:14px; font-weight:700;
    cursor:pointer; transition: var(--transition);
  }

  .btn-review {
    background:rgba(139,92,246,0.2); color:var(--accent-purple);
    border:1px solid rgba(139,92,246,0.4);
  }

  .btn-review:hover { background:rgba(139,92,246,0.35); }

  .btn-restart {
    background: linear-gradient(135deg, var(--accent-blue), var(--accent-cyan));
    color:#fff; box-shadow:var(--glow-blue);
  }

  .btn-restart:hover { transform:translateY(-2px); }

  /* ===== REVIEW SECTION ===== */
  .review-section {
    max-width:700px; width:100%;
  }

  .review-title {
    font-size:20px; font-weight:800; margin-bottom:16px;
    display:flex; align-items:center; gap:10px;
  }

  .review-card {
    background: var(--bg-card);
    border: 1px solid rgba(239,68,68,0.3);
    border-radius:16px; padding:22px;
    margin-bottom:14px;
    border-right: 4px solid var(--accent-red);
    animation: fadeInCard 0.3s ease;
  }

  .review-q { font-size:15px; font-weight:700; margin-bottom:14px; line-height:1.6; }

  .review-answer {
    display:flex; align-items:flex-start; gap:10px;
    padding:10px 14px; border-radius:8px; margin-bottom:8px;
    font-size:14px; line-height:1.5;
  }

  .review-wrong { background:rgba(239,68,68,0.12); border:1px solid rgba(239,68,68,0.25); color:var(--accent-red); }
  .review-correct { background:rgba(16,185,129,0.12); border:1px solid rgba(16,185,129,0.25); color:var(--accent-green); }

  .review-icon { font-size:16px; margin-top:1px; }

  /* ===== ALERT OVERLAY ===== */
  .alert-overlay {
    position:fixed; inset:0; background:rgba(0,0,0,0.8);
    display:none; align-items:center; justify-content:center;
    z-index:999; padding:20px;
  }

  .alert-overlay.show { display:flex; animation:fadeIn 0.2s ease; }

  @keyframes fadeIn { from { opacity:0; } to { opacity:1; } }

  .alert-box {
    background:var(--bg-card); border:1px solid var(--border);
    border-radius:20px; padding:36px 28px; max-width:400px; width:100%;
    text-align:center; box-shadow:0 20px 60px rgba(0,0,0,0.6);
    animation: popIn 0.3s cubic-bezier(0.34,1.56,0.64,1);
  }

  @keyframes popIn {
    from { transform:scale(0.85); opacity:0; }
    to { transform:scale(1); opacity:1; }
  }

  .alert-icon { font-size:48px; margin-bottom:16px; }
  .alert-title { font-size:20px; font-weight:800; margin-bottom:8px; }
  .alert-msg { font-size:14px; color:var(--text-secondary); margin-bottom:24px; }

  .alert-btns { display:flex; gap:12px; }
  .alert-btn {
    flex:1; padding:12px; border:none; border-radius:var(--radius-sm);
    font-family:'Cairo',sans-serif; font-size:15px; font-weight:700;
    cursor:pointer; transition: var(--transition);
  }

  .alert-cancel { background:var(--bg-secondary); color:var(--text-secondary); border:1px solid var(--border); }
  .alert-confirm { background:linear-gradient(135deg,var(--accent-blue),var(--accent-cyan)); color:#fff; }

  /* ===== SCROLLBAR ===== */
  ::-webkit-scrollbar { width:6px; }
  ::-webkit-scrollbar-track { background:var(--bg-primary); }
  ::-webkit-scrollbar-thumb { background:var(--border); border-radius:3px; }

  /* ===== RESPONSIVE ===== */
  @media (max-width:600px) {
    .start-card { padding:32px 20px; }
    .exam-title { font-size:20px; }
    .result-stats { grid-template-columns:repeat(3,1fr); }
    .question-text { font-size:15px; }
    .option-btn { font-size:14px; padding:12px 14px; }
    .result-card { padding:28px 20px; }
    .grade-circle { width:120px; height:120px; }
    .grade-percent { font-size:32px; }
  }

  /* ===== ANSWERED INDICATOR ===== */
  .answered-indicator {
    display:flex; align-items:center; gap:6px;
    font-size:13px; color:var(--accent-green);
    animation: fadeIn 0.3s ease;
  }
</style>
</head>
<body>

<!-- Particles -->
<div class="particles" id="particles"></div>

<!-- ===== START SCREEN ===== -->
<div class="screen active" id="startScreen">
  <div class="start-card">
    <div class="logo-area">
      <div class="logo-icon">🎓</div>
      <div class="logo-title">HICMIS • 2025-2026</div>
    </div>
    <h1 class="exam-title">امتحان مقدمة في الحاسبات</h1>
    <p class="exam-subtitle">د. عبير عصمت علي • م. محمد أشرف بهجت</p>
    <div class="stats-row">
      <div class="stat-chip">📝 <span id="totalQCount">0</span> سؤال</div>
      <div class="stat-chip">🎯 اختيار متعدد + صح/خطأ</div>
    </div>

    <div class="input-group">
      <label class="input-label" for="studentName">👤 اسم الطالب</label>
      <input type="text" id="studentName" class="name-input" placeholder="أدخل اسمك بالكامل..." />
    </div>

    <div class="timer-select-group">
      <label class="input-label">⏱️ مدة الامتحان</label>
      <div class="timer-options">
        <div class="timer-option" data-minutes="30">30 دقيقة</div>
        <div class="timer-option selected" data-minutes="60">60 دقيقة</div>

// =============================================
// AUDIO
// =============================================
function playClick(correct) {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.frequency.setValueAtTime(correct ? 880 : 440, ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(correct ? 1200 : 220, ctx.currentTime+0.1);
    gain.gain.setValueAtTime(0.15, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+0.15);
    osc.start(ctx.currentTime);
    osc.stop(ctx.currentTime+0.15);
  } catch(e){}
}

function playSelect() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.frequency.setValueAtTime(660, ctx.currentTime);
    gain.gain.setValueAtTime(0.08, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+0.08);
    osc.start(ctx.currentTime);
    osc.stop(ctx.currentTime+0.08);
  } catch(e){}
}

// =============================================
// SHUFFLE
// =============================================
function shuffle(arr) {
  const a = [...arr];
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

// =============================================
// START EXAM
// =============================================
function startExam() {
  studentName = document.getElementById('studentName').value.trim();
  if(!studentName) {
    document.getElementById('studentName').style.borderColor = 'var(--accent-red)';
    document.getElementById('studentName').placeholder = '⚠️ يرجى إدخال اسمك أولاً';
    setTimeout(()=>{
      document.getElementById('studentName').style.borderColor='';
      document.getElementById('studentName').placeholder='أدخل اسمك بالكامل...';
    },2000);
    return;
  }

  // Prepare questions with shuffled options
  questions = shuffle(ALL_QUESTIONS).map(q => {
    const shuffledOptions = [...q.options.map((opt,i)=>({text:opt, origIndex:i}))];
    // Shuffle options
    for(let i=shuffledOptions.length-1;i>0;i--){
      const j=Math.floor(Math.random()*(i+1));
      [shuffledOptions[i],shuffledOptions[j]]=[shuffledOptions[j],shuffledOptions[i]];
    }
    const newAnswer = shuffledOptions.findIndex(o=>o.origIndex===q.answer);
    return {...q, shuffledOptions, newAnswer};
  });

  answers = new Array(questions.length).fill(null);
  currentQ = 0;
  timeLeft = selectedMinutes * 60;

  document.getElementById('headerName').textContent = studentName;
  document.getElementById('startScreen').classList.remove('active');
  document.getElementById('examScreen').classList.add('active');

  renderQuestion();
  startTimer();
  examStarted = true;
}

// =============================================
// RENDER QUESTION
// =============================================
function renderQuestion() {
  const q = questions[currentQ];
  const total = questions.length;
  const isLast = currentQ === total - 1;

  // Progress
  const pct = ((currentQ+1)/total)*100;
  document.getElementById('progressFill').style.width = pct+'%';
  document.getElementById('progressText').textContent = (currentQ+1)+' / '+total;

  // Nav buttons
  document.getElementById('nextBtn').style.display = isLast ? 'none' : '';
  document.getElementById('finishBtn').style.display = isLast ? '' : 'none';
  document.getElementById('nextBtn').disabled = answers[currentQ] === null;

  const letters = ['أ','ب','ج','د'];
  const typeBadge = q.type==='tf'
    ? '<span class="question-type-badge badge-tf">✓ صح / خطأ</span>'
    : '<span class="question-type-badge badge-mcq">◉ اختيار متعدد</span>';

  let optionsHTML = '';
  q.shuffledOptions.forEach((opt,i) => {
    const isSelected = answers[currentQ] === i;
    const letter = q.type==='tf' ? (i===0?'✓':'✗') : letters[i];
    optionsHTML += `
      <button class="option-btn ${isSelected?'selected':''}" onclick="selectAnswer(${i})" id="opt_${i}">
        <div class="option-letter">${letter}</div>
        <div class="option-text">${opt.text}</div>
      </button>`;
  });

  document.getElementById('examBody').innerHTML = `
    <div class="question-card">
      <div class="question-meta">
        <div class="question-num">السؤال ${currentQ+1} من ${total}</div>
        ${typeBadge}
      </div>
      <div class="question-text">${q.q}</div>
      <div class="options-grid">${optionsHTML}</div>
    </div>`;

  // Scroll to top
  document.getElementById('examBody').scrollTop = 0;
  window.scrollTo(0,0);
}

// =============================================
// SELECT ANSWER
// =============================================
function selectAnswer(idx) {
  answers[currentQ] = idx;
  playSelect();

  // Update UI
  document.querySelectorAll('.option-btn').forEach((btn,i) => {
    btn.classList.toggle('selected', i===idx);
  });

  document.getElementById('nextBtn').disabled = false;
}

// =============================================
// NEXT QUESTION
// =============================================
function nextQuestion() {
  if(answers[currentQ] === null) {
    // Shake effect
    const btn = document.getElementById('nextBtn');
    btn.style.transform='translateX(-8px)';
    setTimeout(()=>{ btn.style.transform='translateX(8px)'; },100);
    setTimeout(()=>{ btn.style.transform=''; },200);
    return;
  }
  if(currentQ < questions.length-1) {
    currentQ++;
    renderQuestion();
  }
}

// =============================================
// TIMER
// =============================================
function startTimer() {
  updateTimerDisplay();
  timerInterval = setInterval(()=>{
    timeLeft--;
    updateTimerDisplay();
    if(timeLeft<=0) {
      clearInterval(timerInterval);
      finishExam(true);
    }
  },1000);
}

function updateTimerDisplay() {
  const m = Math.floor(timeLeft/60);
  const s = timeLeft%60;
  const display = document.getElementById('timerDisplay');
  display.textContent = '⏱ '+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');

  display.classList.remove('warning','danger');
  if(timeLeft <= 60) display.classList.add('danger');
  else if(timeLeft <= 300) display.classList.add('warning');
}

// =============================================
// FINISH ALERT
// =============================================
function showFinishAlert() {
  const unanswered = answers.filter(a=>a===null).length;
  document.getElementById('alertTitle').textContent = 'إنهاء الامتحان';
  document.getElementById('alertMsg').textContent = unanswered > 0
    ? `⚠️ لديك ${unanswered} سؤال غير مُجاب. هل تريد الإنهاء؟`
    : '✅ هل أنت متأكد من إنهاء الامتحان؟';
  document.getElementById('alertOverlay').classList.add('show');
}

function closeAlert() {
  document.getElementById('alertOverlay').classList.remove('show');
}

// =============================================
// FINISH EXAM
// =============================================
function finishExam(timeUp=false) {
  closeAlert();
  clearInterval(timerInterval);

  // Calculate score
  let correct = 0;
  const wrongQuestions = [];

  questions.forEach((q,i) => {
    const userAns = answers[i];
    if(userAns !== null && userAns === q.newAnswer) {
      correct++;
    } else {
      wrongQuestions.push({
        q: q.q,
        userAns: userAns !== null ? q.shuffledOptions[userAns].text : '(لم يُجب)',
        correctAns: q.shuffledOptions[q.newAnswer].text
      });
    }
  });

  const total = questions.length;
  const wrong = total - correct;
  const pct = Math.round((correct/total)*100);

  let gradeClass, gradeLabel, gradeIcon;
  if(pct>=90){ gradeClass='excellent'; gradeLabel='ممتاز'; gradeIcon='🏆'; }
  else if(pct>=80){ gradeClass='very-good'; gradeLabel='جيد جداً'; gradeIcon='⭐'; }
  else if(pct>=70){ gradeClass='good'; gradeLabel='جيد'; gradeIcon='👍'; }
  else if(pct>=50){ gradeClass='pass'; gradeLabel='مقبول'; gradeIcon='✅'; }
  else { gradeClass='fail'; gradeLabel='راسب'; gradeIcon='❌'; }

  // Build wrong cards
  let wrongHTML = '';
  if(wrongQuestions.length>0) {
    wrongHTML = `
      <div class="review-section">
        <div class="review-title">❌ الإجابات الخاطئة (${wrongQuestions.length} سؤال)</div>
        ${wrongQuestions.map((w,i)=>`
          <div class="review-card">
            <div class="review-q">📌 السؤال ${i+1}: ${w.q}</div>
            <div class="review-answer review-wrong">
              <div class="review-icon">❌</div>
              <div><strong>إجابتك:</strong> ${w.userAns}</div>
            </div>
            <div class="review-answer review-correct">
              <div class="review-icon">✅</div>
              <div><strong>الإجابة الصحيحة:</strong> ${w.correctAns}</div>
            </div>
          </div>`).join('')}
      </div>`;
  } else {
    wrongHTML = `<div class="review-section"><div style="text-align:center;padding:32px;color:var(--accent-green);font-size:48px">🎉</div><div style="text-align:center;font-size:18px;font-weight:700;color:var(--accent-green)">إجاباتك كلها صحيحة!</div></div>`;
  }

  const timeUpMsg = timeUp ? '<div style="color:var(--accent-yellow);font-size:13px;margin-bottom:12px">⏰ انتهى الوقت - تم إنهاء الامتحان تلقائياً</div>' : '';

  document.getElementById('resultScreen').innerHTML = `
    ${timeUpMsg}
    <div class="result-card">
      <div class="grade-circle ${gradeClass}">
        <div class="grade-percent">${pct}%</div>
        <div class="grade-label">${gradeLabel}</div>
      </div>
      <h2 class="grade-title">${gradeIcon} ${gradeLabel}</h2>
      <p class="grade-subtitle">مرحباً ${studentName}، هذه نتيجة امتحانك</p>
      <div class="result-stats">
        <div class="result-stat stat-correct">
          <div class="result-stat-val">${correct}</div>
          <div class="result-stat-label">✅ صحيح</div>
        </div>
        <div class="result-stat stat-wrong">
          <div class="result-stat-val">${wrong}</div>
          <div class="result-stat-label">❌ خطأ</div>
        </div>
        <div class="result-stat stat-total">
          <div class="result-stat-val">${total}</div>
          <div class="result-stat-label">📝 إجمالي</div>
        </div>
      </div>
      <div class="action-btns">
        <button class="action-btn btn-restart" onclick="restartExam()">🔄 إعادة الامتحان</button>
      </div>
    </div>
    ${wrongHTML}
  `;

  document.getElementById('examScreen').classList.remove('active');
  document.getElementById('resultScreen').classList.add('active');

  // Play sound
  playClick(pct >= 50);
}

// =============================================
// RESTART
// =============================================
function restartExam() {
  examStarted = false;
  currentQ = 0;
  answers = [];
  questions = [];
  document.getElementById('resultScreen').classList.remove('active');
  document.getElementById('startScreen').classList.add('active');
  document.getElementById('studentName').value = '';
  document.getElementById('progressFill').style.width = '0%';
}
</script>
</body>
</html>
